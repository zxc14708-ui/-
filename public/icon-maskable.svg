<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512">
  <!-- Full bleed background (maskable: safe zone is center 80%) -->
  <rect width="512" height="512" fill="#0f1117"/>
  <!-- Bar chart bars (shifted inward for safe zone) -->
  <rect x="90" y="310" width="60" height="130" rx="7" fill="#6366f1" opacity="0.85"/>
  <rect x="172" y="240" width="60" height="200" rx="7" fill="#8b5cf6" opacity="0.85"/>
  <rect x="254" y="185" width="60" height="255" rx="7" fill="#6366f1"/>
  <rect x="336" y="128" width="60" height="312" rx="7" fill="#22c55e"/>
  <!-- Trend line -->
  <polyline points="120,284 202,210 284,160 366,104" fill="none" stroke="#10b981" stroke-width="14" stroke-linecap="round" stroke-linejoin="round"/>
  <!-- Trend line dots -->
  <circle cx="120" cy="284" r="10" fill="#10b981"/>
  <circle cx="202" cy="210" r="10" fill="#10b981"/>
  <circle cx="284" cy="160" r="10" fill="#10b981"/>
  <circle cx="366" cy="104" r="10" fill="#10b981"/>
  <!-- Bottom line -->
  <rect x="74" y="452" width="364" height="8" rx="4" fill="#2e3151"/>
</svg>
